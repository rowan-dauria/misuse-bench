[project]
name = "misuse-bench"
version = "0.1.0"
description = "Evaluating jailbroken open models on their ability to complete harmful tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.269",
    "inspect-evals[cybench]>=0.22.0",
    "openai>=3.1.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
misuse-bench = "misuse_bench.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/misuse_bench"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
